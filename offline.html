<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Liquid Chat - Offline / آفلاین</title>
  <meta name="theme-color" content="#0b1224">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1224;
      --panel: rgba(16, 23, 38, 0.92);
      --border: rgba(120, 190, 255, 0.16);
      --text: #eef4ff;
      --muted: #94a3b8;
      --primary: #39d6a4;
      --accent: #4cc2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
      background:
        radial-gradient(900px circle at 15% 10%, rgba(57, 214, 164, 0.12), transparent 50%),
        radial-gradient(800px circle at 85% 85%, rgba(76, 194, 255, 0.1), transparent 50%),
        linear-gradient(145deg, #070c18, var(--bg) 60%, #101a2e);
      color: var(--text);
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    .offline-card {
      width: min(100%, 440px);
      padding: 32px 28px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }
    .logo-badge img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.65;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }
    .button:active {
      transform: scale(0.97);
    }
    .button.primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #05141e;
      box-shadow: 0 8px 20px rgba(57, 214, 164, 0.25);
    }
    .button.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="logo-badge">
      <img src="assets/logo.svg" alt="Liquid Chat" width="52" height="52">
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>ارتباط اینترنت قطع است / No Connection</span>
    </div>
    <h1>اتصال برقرار نیست</h1>
    <p>لیکوئید چت در حالت آفلاین قرار دارد. به محض اتصال مجدد به اینترنت، پیام‌ها و گفتگوها همگام‌سازی خواهند شد.</p>
    <div class="actions">
      <button class="button primary" type="button" onclick="window.location.reload()">تلاش مجدد / Retry</button>
      <a class="button secondary" href="chat.php">صفحه چت / Chat</a>
    </div>
  </main>
  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
